# FundZim local development environment — NOT for production.
#
#   ./scripts/dev-env-init.sh          # once: creates .env with generated local secrets (never overwrites)
#   docker compose up -d --build       # postgres, redis (valkey), storage (garage), migrations, api, worker,
#                                      # web, mail (Mailpit: UI http://127.0.0.1:8025)
#   docker compose --profile scale-test up -d fundzim-api-2   # second API replica on 127.0.0.1:8081
#
# Every published port binds to 127.0.0.1 only. Images are pinned to exact versions and digests.
# Secrets come from .env (git-ignored). Nothing here may ever point at a real payment provider.
#
# Stage 18 hardening (docs/stage-18/container-security.md; checked by scripts/ci/check-compose.py in CI): every
# container drops all Linux capabilities (third-party images add back only what their entrypoint needs to switch to an
# unprivileged user), cannot gain privileges (no-new-privileges), has memory and process limits; FundZim's own
# containers run with a read-only root filesystem. Two networks: `edge` (web and API only) and `default` (API, worker
# and the data services): the web container cannot reach PostgreSQL, Valkey, Garage, OpenBao or ClamAV.
name: fundzim

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512

x-readonly-app: &readonly-app
  <<: *hardened
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]

x-common-env: &common-env
  APP_ENV: development
  APP_NAME: FundZim
  APP_PUBLIC_URL: http://localhost:3000
  INTERNAL_HTTP_HOST: 0.0.0.0           # reachable only via the 127.0.0.1-bound port below
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: 20s
  DATABASE_URL: postgres://fundzim_app:${POSTGRES_APP_PASSWORD:?}@fundzim-postgres:5432/fundzim?sslmode=disable
  # Mail and SMS go to the local Mailpit catcher only.
  EMAIL_PROVIDER: smtp
  SMTP_HOST: fundzim-mail
  SMTP_PORT: "1025"
  SMTP_TLS: none
  EMAIL_FROM: FundZim <no-reply@fundzim.invalid>
  SMS_PROVIDER: dev_mailpit
  CSRF_SECRET: ${CSRF_SECRET:?run scripts/dev-env-init.sh}
  FIELD_ENCRYPTION_PROVIDER: local
  FIELD_ENCRYPTION_LOCAL_KEY: ${FIELD_ENCRYPTION_LOCAL_KEY:?run scripts/dev-env-init.sh}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?run scripts/dev-env-init.sh}
  # Stage 5: restricted pools (ADR-035) and per-purpose keys
  DATABASE_KYC_URL: postgres://fundzim_kyc:${POSTGRES_KYC_PASSWORD:?}@fundzim-postgres:5432/fundzim?sslmode=disable
  # Stage 10 (ADR-042): the ledger posting role — the only writer of the ledger schema
  DATABASE_LEDGER_URL: postgres://fundzim_ledger:${POSTGRES_LEDGER_PASSWORD:?run scripts/dev-env-init.sh}@fundzim-postgres:5432/fundzim?sslmode=disable
  DATABASE_COMPLIANCE_URL: postgres://fundzim_compliance:${POSTGRES_COMPLIANCE_PASSWORD:?}@fundzim-postgres:5432/fundzim?sslmode=disable
  KYC_FIELD_ENCRYPTION_LOCAL_KEY: ${KYC_FIELD_ENCRYPTION_LOCAL_KEY:?run scripts/dev-env-init.sh}
  KYC_BLIND_INDEX_KEY: ${KYC_BLIND_INDEX_KEY:?run scripts/dev-env-init.sh}
  COMPLIANCE_FIELD_ENCRYPTION_LOCAL_KEY: ${COMPLIANCE_FIELD_ENCRYPTION_LOCAL_KEY:?run scripts/dev-env-init.sh}
  DOCUMENT_TICKET_KEY: ${DOCUMENT_TICKET_KEY:?run scripts/dev-env-init.sh}
  MALWARE_SCANNER: ${MALWARE_SCANNER:-clamd}   # real ClamAV (fundzim-clamav); dev = EICAR-only test scanner
  CLAMAV_ADDR: fundzim-clamav:3310
  STORAGE_SSE_C_KEY: ${STORAGE_SSE_C_KEY:?run scripts/dev-env-init.sh}   # SSE-C for private objects (local key; KMS in Stage 18)
  # Stage 8 (ADR-039): payment SANDBOX SIMULATOR only — never real payments; refused in production
  PAYMENTS_SANDBOX_ENABLED: ${PAYMENTS_SANDBOX_ENABLED:-false}
  PAYMENTS_EXECUTION_ENVIRONMENT: ${PAYMENTS_EXECUTION_ENVIRONMENT:-}   # empty = LOCAL_SIMULATOR when the simulator is on
  SANDBOX_WEBHOOK_URL: http://fundzim-api:8080/api/v1/webhooks/payments/sandbox
  # Stage 9 (ADR-041): provider secret references resolve from the secret manager (OpenBao dev mode below);
  # the sandbox test secrets live only there, not in these containers' environment.
  SECRETS_PROVIDER: ${SECRETS_PROVIDER:-kv2}
  SECRETS_KV2_ADDR: http://fundzim-secrets:8200
  SECRETS_KV2_TOKEN: ${SECRETS_KV2_TOKEN:?run scripts/dev-env-init.sh}
  # Stage 10 (ADR-042): TEST_ONLY synthetic ledger fixtures (refused in production)
  LEDGER_SYNTHETIC_FIXTURES_ENABLED: ${LEDGER_SYNTHETIC_FIXTURES_ENABLED:-false}
  PAYOUTS_EXECUTION_ENVIRONMENT: ${PAYOUTS_EXECUTION_ENVIRONMENT:-DISABLED}
  PAYOUTS_SUBMIT_RETRY_BUDGET: ${PAYOUTS_SUBMIT_RETRY_BUDGET:-5}
  PAYOUTS_SUBMIT_RETRY_BASE: ${PAYOUTS_SUBMIT_RETRY_BASE:-5s}
  PAYOUTS_SUBMIT_RETRY_MAX: ${PAYOUTS_SUBMIT_RETRY_MAX:-10m}
  FEES_QUOTE_TTL: ${FEES_QUOTE_TTL:-15m}
  RISK_SCREENING_SANDBOX_ENABLED: ${RISK_SCREENING_SANDBOX_ENABLED:-false}
  # Stage 15 (ADR-047): messaging simulators and local Mailpit senders only
  NOTIFICATIONS_SIMULATOR_ENABLED: ${NOTIFICATIONS_SIMULATOR_ENABLED:-false}
  NOTIFICATIONS_EMAIL_PROVIDER: ${NOTIFICATIONS_EMAIL_PROVIDER:-disabled}
  NOTIFICATIONS_SMS_PROVIDER: ${NOTIFICATIONS_SMS_PROVIDER:-disabled}
  NOTIFICATIONS_WHATSAPP_PROVIDER: ${NOTIFICATIONS_WHATSAPP_PROVIDER:-disabled}

services:
  fundzim-postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # the entrypoint fixes data-dir ownership, then drops to postgres
    # Docker's default /dev/shm (64 MB) is too small for parallel query workers on larger development datasets
    # ("could not resize shared memory segment"); production sizing is an infrastructure decision (Stage 18)
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/dev-env-init.sh}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?}
      POSTGRES_KYC_PASSWORD: ${POSTGRES_KYC_PASSWORD:?}
      POSTGRES_COMPLIANCE_PASSWORD: ${POSTGRES_COMPLIANCE_PASSWORD:?}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?}
      POSTGRES_LEDGER_PASSWORD: ${POSTGRES_LEDGER_PASSWORD:?run scripts/dev-env-init.sh}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?run scripts/dev-env-init.sh (Stage 18 adds POSTGRES_BACKUP_PASSWORD)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundzim"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *logging

  fundzim-redis:
    # Valkey: BSD-licensed, Redis-protocol compatible. Cache/rate-limit only, never authoritative.
    image: valkey/valkey:9.0.6-alpine3.24@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    restart: unless-stopped
    <<: *hardened
    user: "999:1000"   # the image's valkey user: no entrypoint privilege switching, so no capability at all
    read_only: true
    tmpfs: ["/data:size=16m,uid=999,gid=1000", "/run/valkey:size=1m,uid=999,gid=1000,mode=0700"]
    # the password goes into a config file on tmpfs, never onto the command line (Stage 18, F-S18-09)
    entrypoint: ["/bin/sh", "-ec", "umask 077; printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /run/valkey/auth.conf; exec valkey-server /run/valkey/auth.conf --appendonly no --save '' --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    mem_limit: 256m
    logging: *logging

  fundzim-storage:
    # Garage: S3-compatible object storage (MinIO's community images are no longer published).
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    <<: *hardened
    read_only: true
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./deploy/docker/garage/garage.toml:/etc/garage.toml:ro
      - storage-meta:/var/lib/garage/meta
      - storage-data:/var/lib/garage/data
    ports: ["127.0.0.1:${STORAGE_HOST_PORT:-3900}:3900"]   # S3 API only; the admin API stays internal
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    logging: *logging

  fundzim-storage-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    restart: "no"
    <<: *hardened
    read_only: true
    mem_limit: 64m
    depends_on:
      fundzim-storage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: ["./deploy/docker/garage/init.sh:/init.sh:ro"]
    environment:
      GARAGE_ADMIN_URL: http://fundzim-storage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:?}
      STORAGE_PUBLIC_ACCESS_KEY_ID: ${STORAGE_PUBLIC_ACCESS_KEY_ID:?}
      STORAGE_PUBLIC_SECRET_ACCESS_KEY: ${STORAGE_PUBLIC_SECRET_ACCESS_KEY:?}
      STORAGE_KYC_BUCKET: ${STORAGE_KYC_BUCKET:?}
      STORAGE_KYC_ACCESS_KEY_ID: ${STORAGE_KYC_ACCESS_KEY_ID:?}
      STORAGE_KYC_SECRET_ACCESS_KEY: ${STORAGE_KYC_SECRET_ACCESS_KEY:?}
      STORAGE_EVIDENCE_BUCKET: ${STORAGE_EVIDENCE_BUCKET:?}
      STORAGE_EVIDENCE_ACCESS_KEY_ID: ${STORAGE_EVIDENCE_ACCESS_KEY_ID:?}
      STORAGE_EVIDENCE_SECRET_ACCESS_KEY: ${STORAGE_EVIDENCE_SECRET_ACCESS_KEY:?}
    logging: *logging

  fundzim-secrets:
    # Stage 9 (ADR-041): OpenBao in DEV MODE — in-memory storage, plain HTTP, a fixed root token from .env.
    # Local development and CI only; production uses a hardened OpenBao/Vault with AppRole (Stage 18/20).
    # Dev mode keeps nothing across restarts: fundzim-secrets-init re-seeds it (docker compose up re-runs it).
    image: openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
    restart: unless-stopped
    <<: *hardened
    cap_add: [SETGID, SETUID]   # the entrypoint drops to the openbao user (SKIP_SETCAP: no IPC_LOCK in dev mode)
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-no-store-token"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${SECRETS_KV2_TOKEN:?run scripts/dev-env-init.sh}
      SKIP_SETCAP: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${SECRETS_HOST_PORT:-8200}:8200"
    mem_limit: 256m
    logging: *logging

  fundzim-secrets-init:
    # Copies the simulator's generated test secrets from .env into the secret manager (stdin, never argv).
    image: openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
    restart: "no"
    <<: *hardened
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    mem_limit: 64m
    depends_on:
      fundzim-secrets: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        put() { printf '%s' "$$2" | bao kv put -mount=secret "$$1" value=- >/dev/null; echo "seeded $$1"; }
        put fundzim/sandbox/api "$$SB_API"
        put fundzim/sandbox/webhook-current "$$SB_WEBHOOK_CURRENT"
        put fundzim/sandbox/webhook-previous "$$SB_WEBHOOK_PREVIOUS"
    environment:
      BAO_ADDR: http://fundzim-secrets:8200
      BAO_TOKEN: ${SECRETS_KV2_TOKEN:?run scripts/dev-env-init.sh}
      SB_API: ${SECRETREF_FUNDZIM_SANDBOX_API:?run scripts/dev-env-init.sh}
      SB_WEBHOOK_CURRENT: ${SECRETREF_FUNDZIM_SANDBOX_WEBHOOK_CURRENT:?run scripts/dev-env-init.sh}
      SB_WEBHOOK_PREVIOUS: ${SECRETREF_FUNDZIM_SANDBOX_WEBHOOK_PREVIOUS:?run scripts/dev-env-init.sh}
    healthcheck: { disable: true }
    logging: *logging

  fundzim-migrate:
    # FundZim images are tagged with the compose project name (F-R1-07): a disposable project (`-p fundzim-r1`) builds
    # fundzim/api:fundzim-r1 and can never replace the image the development project (`fundzim`) migrates with.
    # Set GIT_COMMIT=$(git rev-parse HEAD) when building so /api/v1/version names the source commit.
    build: &api-build
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args:
        VERSION: ${APP_VERSION:-0.1.0-dev}
        COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: fundzim/api:${COMPOSE_PROJECT_NAME}
    restart: "no"
    <<: *readonly-app
    mem_limit: 256m
    depends_on:
      fundzim-postgres: { condition: service_healthy }
    entrypoint: ["/usr/local/bin/fundzimctl", "migrate", "up"]
    environment:
      APP_ENV: development
      DATABASE_MIGRATION_URL: postgres://fundzim_migrator:${POSTGRES_MIGRATOR_PASSWORD:?}@fundzim-postgres:5432/fundzim?sslmode=disable
    healthcheck: { disable: true }
    logging: *logging

  fundzim-api:
    build: *api-build
    image: fundzim/api:${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    <<: *readonly-app
    networks: [default, edge]
    depends_on: &api-depends
      fundzim-migrate: { condition: service_completed_successfully }
      fundzim-secrets-init: { condition: service_completed_successfully }
      fundzim-storage-init: { condition: service_completed_successfully }
      fundzim-redis: { condition: service_healthy }
      fundzim-mail: { condition: service_started }
    environment: &api-env
      <<: *common-env
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      INTERNAL_HTTP_PORT: "9090"
      REQUEST_TIMEOUT: 15s
      # Only the web container's same-origin proxy (fixed address on the edge network) may set X-Forwarded-For.
      # Requests from the host arrive from a Docker gateway, which is NOT trusted.
      TRUSTED_PROXY_CIDRS: 172.28.1.10/32
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@fundzim-redis:6379/0
      REDIS_REQUIRED: "false"
      STORAGE_ENDPOINT: http://fundzim-storage:3900
      STORAGE_REGION: garage
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:?}
      STORAGE_PUBLIC_ACCESS_KEY_ID: ${STORAGE_PUBLIC_ACCESS_KEY_ID:?}
      STORAGE_PUBLIC_SECRET_ACCESS_KEY: ${STORAGE_PUBLIC_SECRET_ACCESS_KEY:?}
      STORAGE_KYC_BUCKET: ${STORAGE_KYC_BUCKET:?}
      STORAGE_KYC_ACCESS_KEY_ID: ${STORAGE_KYC_ACCESS_KEY_ID:?}
      STORAGE_KYC_SECRET_ACCESS_KEY: ${STORAGE_KYC_SECRET_ACCESS_KEY:?}
      STORAGE_EVIDENCE_BUCKET: ${STORAGE_EVIDENCE_BUCKET:?}
      STORAGE_EVIDENCE_ACCESS_KEY_ID: ${STORAGE_EVIDENCE_ACCESS_KEY_ID:?}
      STORAGE_EVIDENCE_SECRET_ACCESS_KEY: ${STORAGE_EVIDENCE_SECRET_ACCESS_KEY:?}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${API_INTERNAL_HOST_PORT:-9090}:9090"
    stop_grace_period: 25s
    mem_limit: 512m
    logging: *logging

  fundzim-api-2:
    # Second API replica for distributed rate-limit tests:  docker compose --profile scale-test up -d
    build: *api-build
    image: fundzim/api:${COMPOSE_PROJECT_NAME}
    profiles: ["scale-test"]
    restart: unless-stopped
    <<: *readonly-app
    networks: [default, edge]
    depends_on: *api-depends
    environment: *api-env
    ports:
      - "127.0.0.1:${API2_HOST_PORT:-8081}:8080"
    stop_grace_period: 25s
    mem_limit: 512m
    logging: *logging

  fundzim-worker:
    # Background worker: River job queue, outbox relay/delivery, notifications, maintenance.
    build: *api-build
    image: fundzim/api:${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    depends_on:
      fundzim-migrate: { condition: service_completed_successfully }
      fundzim-secrets-init: { condition: service_completed_successfully }
      fundzim-mail: { condition: service_started }
    entrypoint: ["/usr/local/bin/worker"]
    <<: *readonly-app
    environment:
      <<: *common-env                      # no Redis: the worker does not use it
      # malware scanning and promotion of private documents (Stage 5); campaign images (Stage 6 stream M): scanning
      # the public-media quarantine and storing re-encoded derivatives needs the public-media credential too
      STORAGE_ENDPOINT: http://fundzim-storage:3900
      STORAGE_REGION: garage
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_KYC_BUCKET: ${STORAGE_KYC_BUCKET:?}
      STORAGE_KYC_ACCESS_KEY_ID: ${STORAGE_KYC_ACCESS_KEY_ID:?}
      STORAGE_KYC_SECRET_ACCESS_KEY: ${STORAGE_KYC_SECRET_ACCESS_KEY:?}
      STORAGE_EVIDENCE_BUCKET: ${STORAGE_EVIDENCE_BUCKET:?}
      STORAGE_EVIDENCE_ACCESS_KEY_ID: ${STORAGE_EVIDENCE_ACCESS_KEY_ID:?}
      STORAGE_EVIDENCE_SECRET_ACCESS_KEY: ${STORAGE_EVIDENCE_SECRET_ACCESS_KEY:?}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:?}
      STORAGE_PUBLIC_ACCESS_KEY_ID: ${STORAGE_PUBLIC_ACCESS_KEY_ID:?}
      STORAGE_PUBLIC_SECRET_ACCESS_KEY: ${STORAGE_PUBLIC_SECRET_ACCESS_KEY:?}
      DATABASE_WORKER_URL: postgres://fundzim_worker:${POSTGRES_WORKER_PASSWORD:?}@fundzim-postgres:5432/fundzim?sslmode=disable
      WORKER_INTERNAL_HTTP_PORT: "9091"
      AUDIT_CHECKPOINT_KEY: ${AUDIT_CHECKPOINT_KEY:?run scripts/dev-env-init.sh (Stage 18 adds AUDIT_CHECKPOINT_KEY)}
      WORKER_CONCURRENCY: "4"
      SHUTDOWN_TIMEOUT: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/fundzimctl", "healthcheck", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 3
    ports:
      - "127.0.0.1:${WORKER_INTERNAL_HOST_PORT:-9091}:9091"
    stop_grace_period: 35s
    mem_limit: 512m   # campaign image decoding (one at a time, up to 40 MP) needs headroom (Stage 6 stream M)
    logging: *logging

  fundzim-web:
    build:
      context: apps/web
      dockerfile: ../../deploy/docker/web.Dockerfile
    image: fundzim/web:${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=256m,uid=1000,gid=1000"]
    depends_on:
      fundzim-api: { condition: service_healthy }
    environment:
      API_BASE_URL: http://fundzim-api:8080
      # canonical/Open Graph/share URLs (never derived from request headers); indexing stays off unless allowed
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      SITE_INDEXING: ${SITE_INDEXING:-disallow}
    networks:
      edge:
        ipv4_address: 172.28.1.10   # the API trusts X-Forwarded-For from this address only; no data-service access
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    mem_limit: 768m
    logging: *logging

  fundzim-mail:
    # Local mail catcher (Mailpit): receives all email and dev_mailpit SMS. UI/API on 127.0.0.1:8025.
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    <<: *hardened
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    ports:
      - "127.0.0.1:${MAIL_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAIL_SMTP_HOST_PORT:-1025}:1025"
    mem_limit: 128m
    logging: *logging

  fundzim-clamav:
    # Malware scanner for uploaded documents (clamd INSTREAM on TCP 3310; Stage 5, ADR-035 §5). The official
    # image runs freshclam, which DOWNLOADS SIGNATURES FROM THE INTERNET on first start (several hundred MB,
    # a few minutes) and keeps them in the clamav-db volume; until they load, clamd is not healthy and scans
    # fail (documents stay FAILED_SCAN and are retried — never treated as clean). Needs ~1.5–2 GB RAM while
    # signatures load. The 127.0.0.1 port exists only for host-run integration tests.
    image: clamav/clamav:1.5.3@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
    restart: unless-stopped
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # the entrypoint prepares its directories, then drops to clamav
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "600"
    volumes:
      - clamav-db:/var/lib/clamav
    ports: ["127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    mem_limit: 3g
    logging: *logging

networks:
  default:
    # API, worker and data services. Not `internal`: development publishes ports to 127.0.0.1 for host-run tests
    # (production network policy: docs/stage-18/network-security.md).
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  edge:
    # web ⇄ API only. Fixed subnet so the API can trust exactly the web container (172.28.1.10); dynamic addresses
    # come from the upper half, so no other container can take .10.
    ipam:
      config:
        - subnet: 172.28.1.0/24
          ip_range: 172.28.1.128/25
          gateway: 172.28.1.1

volumes:
  postgres-data:
  storage-meta:
  storage-data:
  clamav-db:
