# FundZim CI. Least privilege, no secrets, no deployments. Third-party actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main, "stage-**", "remediation/**"]   # `*` does not match `/`; stage branches are stage-N/name
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (format, vet, unit tests, vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l apps internal migrations tests)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./apps/api/... ./internal/... ./migrations/...
      - run: go vet -tags integration ./tests/...
      - name: vet the payments performance harness (never run in CI)
        run: go vet -tags integration,perf -overlay tests/perf/payments/overlay.json ./tests/integration/
      - name: vet the public and discovery performance harnesses (Stage 7, Stage 16; never run in CI)
        run: go vet -tags perf ./tests/perf/
      - run: go test -race -count=1 ./apps/api/... ./internal/... ./migrations/...
      - name: fuzz smoke (money)
        run: |
          go test -run=^$ -fuzz=FuzzParseNeverPanicsOrRounds -fuzztime=20s ./internal/platform/money/
          go test -run=^$ -fuzz=FuzzUnmarshalNeverPanics -fuzztime=20s ./internal/platform/money/
      - name: Payment layer (Stage 8) — state machine vs SQL, webhook signatures, simulator scenarios, execution gates
        run: |
          set -o pipefail
          go test -race -count=1 -v ./internal/payments/ ./internal/psp/... | grep -E '^(--- |ok|FAIL|PASS)'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./apps/api/... ./internal/... ./migrations/...
      - name: Static analysis (gosec; reviewed exceptions are #nosec with a justification, docs/stage-18/application-security.md)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=apps/web ./apps/api/... ./internal/... ./migrations/...

  web:
    name: Web (lint, types, unit tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report)
        # Known dev-only finding in the eslint-config-next chain is tracked in docs/stage-3/known-issues.md
        # (KI-03). This step prints the full report; production dependencies are gated above.
        run: npm audit --audit-level=high || echo "::warning::npm audit reports dev-dependency findings (see docs/stage-3/known-issues.md KI-03)"

  e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contracts:
    name: OpenAPI and SQL design drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npx --yes @redocly/cli@2.54.3 lint api/openapi/fundzim-v1.yaml --config api/openapi/redocly.yaml
      - name: Validate SQL design drafts (in-memory PGlite)
        working-directory: design/sql/validate
        run: npm ci --no-audit --no-fund && node run.mjs && node catalogue.mjs

  integration:
    name: Integration (real PostgreSQL, Valkey, Garage, ClamAV via docker compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate throwaway local secrets
        run: ./scripts/dev-env-init.sh
      - name: Start infrastructure, initialise storage, migrate
        run: |
          docker compose up -d --wait fundzim-postgres fundzim-redis fundzim-storage fundzim-mail fundzim-secrets
          # Stage 9 (ADR-041): OpenBao dev server seeded with the generated sandbox test keys (secret manager)
          docker compose up --exit-code-from fundzim-secrets-init fundzim-secrets-init
          # ClamAV downloads its signatures on first start (several minutes); the worker scans uploads with it
          docker compose up -d fundzim-clamav
          docker compose up --exit-code-from fundzim-storage-init fundzim-storage-init
          docker compose up --build --exit-code-from fundzim-migrate fundzim-migrate
      - name: Start the API on the runner
        run: |
          set -a; . ./.env; set +a
          go build -o bin/api ./apps/api/cmd/api
          LOG_FORMAT=json ./bin/api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/v1/ready && break; sleep 1; done
      - name: Wait for ClamAV signatures (real malware scanning for the Stage 5 document tests)
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q fundzim-clamav)")" = healthy ] && exit 0
            sleep 10
          done
          echo "::error::ClamAV did not become healthy"; exit 1
      - name: Start the worker on the runner
        run: |
          set -a; . ./.env; set +a
          go build -o bin/worker ./apps/api/cmd/worker
          LOG_FORMAT=json ./bin/worker > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9091/readyz && break; sleep 1; done
      - name: Integration tests (identity, verification, campaigns, Stage 8 payments and Stage 9 execution isolation, secret manager, conformance suite, evidence — via the running worker, OpenBao, ClamAV and Mailpit)
        run: |
          set -a; . ./.env; set +a
          set -o pipefail
          FUNDZIM_IT_API_URL=http://127.0.0.1:8080 FUNDZIM_IT_PERF=1 \
            go test -tags integration -count=1 -timeout 40m -json ./tests/integration/... | python3 scripts/ci/go-test-annotate.py
      - name: Destructive migration round trip (after stopping the API and worker; throwaway database)
        run: |
          pkill -f bin/worker || true
          pkill -f bin/api || true
          sleep 2
          set -a; . ./.env; set +a
          FUNDZIM_IT_DESTRUCTIVE=1 go test -tags integration -count=1 -v -run '^TestMigrationsAppliedAndRepeatable$' ./tests/integration/...
      - name: Logs on failure
        if: failure()
        run: |
          cat api.log || true
          cat worker.log || true
          docker compose logs --no-color || true
      - if: always()
        run: docker compose down -v

  e2e-real:
    name: Real-stack E2E (compose + Playwright)
    # Browser tests against the full compose stack (web, API, worker, PostgreSQL, Valkey, Garage, Mailpit, ClamAV):
    # apps/web/e2e-real, docs/stage-7/interface-contracts.md §6. No mocks. The host lock used for local runs
    # (flock, see apps/web/e2e-real/README.md) is not needed here: this job has its own throwaway stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Read by compose for fundzim-web and by the specs: assert the full indexing behaviour (robots, sitemap).
      SITE_INDEXING: allow
      PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # scripts/e2e/bootstrap-admins.sh runs `go run ./apps/api/cmd/fundzimctl bootstrap-admins`
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate throwaway local secrets
        run: ./scripts/dev-env-init.sh
      - name: Start infrastructure, initialise storage, migrate
        run: |
          docker compose up -d --wait fundzim-postgres fundzim-redis fundzim-storage fundzim-mail fundzim-secrets
          # Stage 9 (ADR-041): OpenBao dev server seeded with the generated sandbox test keys (secret manager)
          docker compose up --exit-code-from fundzim-secrets-init fundzim-secrets-init
          # ClamAV downloads its signatures on first start (several minutes); the worker scans every upload with it
          docker compose up -d fundzim-clamav
          docker compose up --exit-code-from fundzim-storage-init fundzim-storage-init
          docker compose up --build --exit-code-from fundzim-migrate fundzim-migrate
      - name: Install web dependencies and Playwright Chromium (while ClamAV loads)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Wait for ClamAV signatures
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q fundzim-clamav)")" = healthy ] && exit 0
            sleep 10
          done
          echo "::error::ClamAV did not become healthy"; exit 1
      - name: Build and start the API, worker and web containers
        run: |
          docker compose up -d --build --wait --wait-timeout 300 fundzim-api fundzim-worker fundzim-web
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/api/v1/ready
      - name: Real-stack Playwright suite
        working-directory: apps/web
        # The `github` reporter (enabled when CI is set) turns each failure into an ::error annotation with the
        # test title and message: job logs need authentication, annotations do not.
        run: npm run test:e2e:real
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400 fundzim-api fundzim-worker fundzim-web || true
      - if: always()
        run: docker compose down -v

  images:
    name: Container images (build, SBOM, vulnerability scan, provenance)
    # Stage 18 (docs/stage-18/supply-chain-security.md): every image gets a CycloneDX SBOM and a Trivy scan; a CRITICAL or
    # HIGH vulnerability with a published fix fails the build (unfixed ones are reported, never suppressed). Binaries get
    # SHA-256 checksums and a provenance record. Artifacts are kept 30 days. Nothing is pushed or deployed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker build -f deploy/docker/api.Dockerfile --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t fundzim/api:ci .
      - run: docker build -f deploy/docker/web.Dockerfile -t fundzim/web:ci apps/web
      - name: Images run as non-root
        run: |
          test "$(docker image inspect fundzim/api:ci --format '{{.Config.User}}')" = "65532:65532"
          test -n "$(docker image inspect fundzim/web:ci --format '{{.Config.User}}')"
          test "$(docker image inspect fundzim/web:ci --format '{{.Config.User}}')" != "root"
      - name: Install syft and trivy (pinned releases, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  syft.tgz" | sha256sum -c -
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && tar -xzf trivy.tgz trivy
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: SBOMs (CycloneDX JSON)
        run: |
          mkdir -p evidence
          syft scan docker:fundzim/api:ci -q -o cyclonedx-json=evidence/sbom-api.cdx.json
          syft scan docker:fundzim/web:ci -q -o cyclonedx-json=evidence/sbom-web.cdx.json
          syft scan dir:. -q --exclude './apps/web/node_modules' -o cyclonedx-json=evidence/sbom-source.cdx.json
      - name: Image vulnerability scan (report everything; fail on fixable CRITICAL/HIGH)
        run: |
          for img in api web; do
            trivy image --quiet --scanners vuln --format json -o "evidence/trivy-$img.json" "fundzim/$img:ci"
            trivy image --quiet --scanners vuln --format table --severity CRITICAL,HIGH "fundzim/$img:ci" | tee "evidence/trivy-$img.txt"
          done
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 fundzim/api:ci
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 fundzim/web:ci
      - name: Binaries, checksums and provenance record
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/Fatifizo/fundzim/internal/platform/version.Commit=${{ github.sha }}" -o bin/ ./apps/api/cmd/...
          (cd bin && sha256sum * > ../evidence/binaries.sha256)
          python3 - <<'PY'
          import json, os, subprocess
          def sh(*a): return subprocess.check_output(a, text=True).strip()
          rec = {"repository": os.environ["GITHUB_REPOSITORY"], "commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF"],
                 "workflow_run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                 "runner": os.environ.get("RUNNER_OS", ""), "go": sh("go", "version"),
                 "images": {i: sh("docker", "image", "inspect", "--format", "{{.Id}}", f"fundzim/{i}:ci") for i in ("api", "web")},
                 "binaries": dict(reversed(l.split("  ")) for l in open("evidence/binaries.sha256").read().splitlines()),
                 "note": "unsigned provenance record (no signing infrastructure is configured; docs/stage-18/supply-chain-security.md)"}
          json.dump(rec, open("evidence/provenance.json", "w"), indent=2)
          PY
          cat evidence/provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/check-secrets.sh
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact
