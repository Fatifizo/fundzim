components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-fz_session
      description: 'Opaque server-side session (ADR-027): HttpOnly, Secure, SameSite=Lax, Path=/. USER sessions only; there are no guest sessions
        (baseline §12 I-2). When the cookie is present on an unsafe request, `X-CSRF-Token` is required.'
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-fz_session
      description: Same cookie, but the session must belong to a STAFF account and have completed MFA (WebAuthn/TOTP, never SMS). Idle 15 min
        / absolute 12 h. Non-staff sessions get 404 on /admin routes.
      x-fundzim-requires-mfa: true
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchroniser token bound to the session (from `GET /auth/session`). Required with the session cookie on POST/PUT/PATCH/DELETE,
        together with Origin and Sec-Fetch-Site checks. Cookie-less guest requests are checked by Origin/Sec-Fetch-Site only.
    donationAccessToken:
      type: apiKey
      in: header
      name: X-Donation-Access-Token
      description: Per-donation capability returned once to guest donors (≥ 256-bit random; only SHA-256 stored in `app.donations.access_token_hash`;
        expires). Grants read-only access to that donation, its payment status and receipt, and lets the donor request a refund (baseline §12
        I-2). Header only; never accepted in URLs.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Provider-specific signature header(s) (HMAC-SHA256 / RSA / Ed25519 per adapter) over the exact raw body, with timestamp replay
        window where supported. Actual header names are adapter-defined (ADR-029).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Required on financial mutations. Same key + same request → stored response replayed; same key + different request → 409 IDEMPOTENCY_KEY_REUSED;
        still processing → 409 IDEMPOTENCY_REQUEST_IN_PROGRESS. Scope: actor (user/staff id; for guests the anonymous scope bound to the request
        hash) + route template. Retention ≥ 24 h.'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional; same semantics as the required form when sent.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]{8,64}$
      description: Accepted only from trusted proxies; otherwise generated. Always echoed in the response header and `meta.request_id`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor from `meta.next_cursor`.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    XRequestId:
      description: Request correlation id.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: '`true` when the body is a replay of the stored response for this Idempotency-Key.'
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Malformed request, missing/invalid Idempotency-Key, invalid cursor or filter. Possible codes are listed per operation in `x-fundzim-error-codes`;
        full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthenticated (or webhook signature invalid). Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue
        in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted (incl. CSRF, MFA, step-up, SoD conflicts). Possible codes are listed per operation in `x-fundzim-error-codes`;
        full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found — also returned instead of 403 where existence is sensitive (404-vs-403 rule). Possible codes are listed per operation
        in `x-fundzim-error-codes`; full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict, version conflict or idempotency conflict. Possible codes are listed per operation in `x-fundzim-error-codes`;
        full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    PayloadTooLarge:
      description: Payload too large. Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type. Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Validation or business-rule failure. Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue in
        docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited. Honour `Retry-After`. Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    InternalError:
      description: Server error (no internals disclosed). Possible codes are listed per operation in `x-fundzim-error-codes`; full catalogue in
        docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service or provider unavailable. Honour `Retry-After`. Possible codes are listed per operation in `x-fundzim-error-codes`;
        full catalogue in docs/api/error-model.md.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
