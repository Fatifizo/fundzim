    CurrencyMoneyStates:
      type: object
      description: Money states of one campaign in ONE currency. Each field is a separate ledger-derived state (settlement-and-custody-model §2).
        Never add them into one balance.
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        raised_gross:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Captured (SUCCEEDED) donations, gross, before fees/refunds.
        fees:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Platform + provider fees attributed to the campaign.
        refunded:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Refunds confirmed.
        reversed:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Chargebacks / provider reversals.
        awaiting_settlement:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Captured but not yet settled/released (`campaign_unsettled`).
        available:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Settled and released, withdrawable subject to eligibility (`campaign_payable`).
        reserved:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Reserve holdback (`campaign_reserve`, PD-33).
        pending_payout:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Claimed by non-submitted payout requests (`campaign_payout_pending`).
        in_transit:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Payouts SUBMITTED/PROCESSING/UNKNOWN for this campaign.
        paid_out:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Payouts COMPLETED (net of REVERSED).
        held:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Held by freeze or compliance hold (`campaign_held`). Shown without reason.
      required:
      - currency
      - raised_gross
      - fees
      - refunded
      - reversed
      - awaiting_settlement
      - available
      - reserved
      - pending_payout
      - in_transit
      - paid_out
      - held
    CampaignFinancialSummary:
      type: object
      description: 'Owner financial summary: one entry per currency the campaign has activity in. There is deliberately no total/balance field.'
      properties:
        campaign_id:
          $ref: '#/components/schemas/Uuid'
        as_of:
          $ref: '#/components/schemas/Timestamp'
        currencies:
          type: array
