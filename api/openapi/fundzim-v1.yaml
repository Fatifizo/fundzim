# FundZim API — OpenAPI 3.1 contract (Stage 2 design, ADR-026).
# Source of truth for /api/v1. Human-readable design: docs/api/api-design.md.
# Lint: npx --yes @redocly/cli@2.54.3 lint api/openapi/fundzim-v1.yaml --config api/openapi/redocly.yaml
openapi: 3.1.0
info:
  title: FundZim API
  version: 1.0.0-draft.stage2
  summary: Contract for the FundZim /api/v1 HTTP API (Stage 2 design; no implementation yet).
  description: 'Contract-first OpenAPI for FundZim (ADR-026). Design source: docs/api/api-design.md, docs/api/authorization-matrix.md, docs/api/error-model.md,
    docs/stage-2/design-baseline.md.


    Conventions: JSON `snake_case`; RFC 3339 UTC timestamps; envelope `{data, meta}` / `{error, meta}`; money is `{amount_minor: string, currency}`
    and is never summed across currencies; cursor pagination (`limit` ≤ 100, `cursor`, `meta.next_cursor`); `Idempotency-Key` required on financial
    mutations; CSRF token (`X-CSRF-Token`) on every unsafe cookie-authenticated request.


    Staff routes live under `/api/v1/admin/*`, require a staff account session that completed MFA, and return `404 ROUTE_NOT_FOUND` to non-staff
    sessions. Step-up requirements are marked `x-fundzim-step-up: true`. Each operation lists its endpoint id, permission, idempotency, rate-limit
    class, audit action and specific error codes in `x-fundzim-*` extensions.


    This document never contains secrets or C3 values: no token hashes, ciphertext, full account numbers, identity numbers or internal risk scores
    in public/owner DTOs. Write-only C3 inputs are marked `writeOnly`.'
servers:
- url: /api/v1
  description: Same-origin API behind the reverse proxy.
security:
- session: []
tags:
- name: Authentication
  description: Sessions, OTP login, step-up, staff MFA.
- name: User profiles
  description: Signed-in user's own account (`/me`).
- name: Organisations
  description: Organisations, membership and invitations (ORG_ADMIN / ORG_MEMBER).
- name: Beneficiaries
  description: Beneficiaries, evidence, consents, institution payees; staff verification decisions.
- name: Campaign creation
  description: Owner campaign authoring and lifecycle (owner / organisation members).
- name: Campaign updates
  description: Owner posts and public update feed.
- name: Campaign discovery
  description: Public, cacheable reads. Only ACTIVE/COMPLETED (and noticed SUSPENDED/FROZEN/CANCELLED) campaigns with PUBLIC visibility; UNLISTED
    by direct link only.
- name: Campaign moderation (staff)
  description: Review pipeline, suspension, freeze, visibility, abuse reports.
- name: Donations
  description: Donation creation (with payment intent), donor views, receipts, staff donation views.
- name: Payment intents
  description: Donor cancel; staff payment inspection and status queries.
- name: Payment status
  description: Donor-facing status; UNKNOWN is surfaced distinctly ("don't pay again").
- name: Refund requests
  description: Donor refund requests; staff refund maker-checker; disputes and recovery (staff).
- name: Payout destinations
  description: Masked payout destinations; owner add/deactivate (step-up); staff overrides (maker-checker).
- name: Payout requests
  description: Owner payout requests (request, cancel before SUBMITTED, view) and staff approval.
- name: Payout status
  description: Owner polling/timeline (read-only) and staff provider status queries.
- name: KYC
  description: Individual verification (user) and KYC review (staff). Never returns document contents or ID numbers except via audited view/reveal.
- name: KYB
  description: Organisation verification and fundraising authority; KYB review (staff).
- name: Compliance (staff)
  description: Cases, notes, decisions (maker-checker), screening, restrictions, overrides. STR-restricted cases invisible without `str.prepare`.
- name: Risk (staff)
  description: Holds, limits registry, monitoring alerts, risk assessments.
- name: Admin operations
  description: Users, staff and roles, fees, config, kill switches, providers, webhook dead letters.
- name: Notifications
  description: Preferences and one-click unsubscribe. Transactional/security notifications cannot be disabled.
- name: Reports
  description: Asynchronous staff reports (owner statements are CMP-15).
- name: Reconciliation (staff)
  description: Settlement imports, runs, discrepancies and resolutions; ledger inspection and adjustments (FINANCE).
- name: Audit access (staff)
  description: Scoped, audited read access to audit and security-audit chains; evidence metadata.
- name: Webhooks
  description: 'Provider callbacks: signature-authenticated, CSRF/session-exempt, inbox + 2xx fast.'
- name: Health
  description: Outside `/api/v1`. Liveness and readiness for the platform; not routed publicly in production.
paths:
  /auth/session:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    get:
      tags:
      - Authentication
      operationId: getSession
      summary: Get the current session and CSRF token
      description: '**AUTH-01** · Auth: session · Authorization: Session holder (user or staff). No session → 401; there are no guest sessions.


        Idempotency: n/a · Rate-limit class: `RL-USER-READ` · Audit: —'
      security:
      - session: []
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-01
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-USER-READ
      x-fundzim-audit: —
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
  /auth/otp:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: sendLoginOtp
      summary: Send a login OTP
      description: '**AUTH-02** · Auth: none · Authorization: Anyone; enumeration-resistant uniform 202.


        Idempotency: n/a · Rate-limit class: `RL-OTP-SEND` · Audit: auth.otp.sent (security)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '202':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-02
      x-fundzim-auth: none
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-SEND
      x-fundzim-audit: auth.otp.sent (security)
      x-fundzim-error-codes:
      - CHALLENGE_REQUIRED
      - CSRF_TOKEN_INVALID
      - VALIDATION_FAILED
  /auth/otp/verify:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: verifyLoginOtp
      summary: Verify OTP and sign in
      description: '**AUTH-03** · Auth: none · Authorization: Holder of the challenge.


        Idempotency: n/a · Rate-limit class: `RL-OTP-VERIFY` · Audit: auth.login.succeeded / auth.login.failed / auth.otp.failed_max_attempts
        (security)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-03
      x-fundzim-auth: none
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-VERIFY
      x-fundzim-audit: auth.login.succeeded / auth.login.failed / auth.otp.failed_max_attempts (security)
      x-fundzim-error-codes:
      - CSRF_TOKEN_INVALID
      - INVALID_CREDENTIALS
      - OTP_ATTEMPTS_EXCEEDED
      - OTP_EXPIRED
      - OTP_INVALID
      - VALIDATION_FAILED
  /auth/logout:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Sign out (server-side session deletion)
      description: '**AUTH-04** · Auth: session · Authorization: Session holder.


        Idempotency: n/a · Rate-limit class: `RL-USER-WRITE` · Audit: auth.session.revoked (security)'
      security:
      - session: []
        csrfToken: []
      responses:
        '204':
          description: No content.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-04
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-USER-WRITE
      x-fundzim-audit: auth.session.revoked (security)
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
  /auth/step-up/challenges:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: startStepUp
      summary: Start a step-up challenge (user OTP)
      description: '**AUTH-05** · Auth: session · Authorization: Signed-in user.


        Idempotency: n/a · Rate-limit class: `RL-OTP-SEND` · Audit: auth.otp.sent (security)'
      security:
      - session: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpChallengeRequest'
      responses:
        '201':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-05
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-SEND
      x-fundzim-audit: auth.otp.sent (security)
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
      - VALIDATION_FAILED
  /auth/step-up/verify:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: verifyStepUp
      summary: Complete step-up (rotates session)
      description: '**AUTH-06** · Auth: session · Authorization: Signed-in user.


        Idempotency: n/a · Rate-limit class: `RL-OTP-VERIFY` · Audit: auth.step_up.succeeded (security)'
      security:
      - session: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpVerifyRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-06
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-VERIFY
      x-fundzim-audit: auth.step_up.succeeded (security)
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
      - OTP_ATTEMPTS_EXCEEDED
      - OTP_EXPIRED
      - OTP_INVALID
      - VALIDATION_FAILED
  /me/sessions:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    get:
      tags:
      - Authentication
      operationId: listMySessions
      summary: List my sessions
      description: '**AUTH-07** · Auth: session · Authorization: Own sessions only.


        Idempotency: n/a · Rate-limit class: `RL-USER-READ` · Audit: —'
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-07
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-USER-READ
      x-fundzim-audit: —
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
  /me/sessions/{session_id}:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    delete:
      tags:
      - Authentication
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: '**AUTH-08** · Auth: session · Authorization: Own sessions only (others → 404).


        Idempotency: n/a · Rate-limit class: `RL-USER-WRITE` · Audit: auth.session.revoked (security)'
      security:
      - session: []
        csrfToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: No content.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-08
      x-fundzim-auth: session
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-USER-WRITE
      x-fundzim-audit: auth.session.revoked (security)
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
      - SESSION_NOT_FOUND
  /admin/auth/login:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: staffLogin
      summary: Staff password login (step 1; returns mandatory MFA challenge)
      description: '**AUTH-09** · Auth: none · Authorization: STAFF accounts only (password, Argon2id; baseline §12 I-6); uniform failure.


        Path is under /admin but reachable without a session (login).


        Idempotency: n/a · Rate-limit class: `RL-OTP-VERIFY` · Audit: auth.login.failed on failure (security)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMfaChallengeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-09
      x-fundzim-auth: none
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-VERIFY
      x-fundzim-audit: auth.login.failed on failure (security)
      x-fundzim-error-codes:
      - CHALLENGE_REQUIRED
      - CSRF_TOKEN_INVALID
      - INVALID_CREDENTIALS
      - VALIDATION_FAILED
  /admin/auth/mfa/verify:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: staffMfaVerify
      summary: Complete staff MFA — WebAuthn or TOTP, never SMS/email (creates staff session)
      description: '**AUTH-10** · Auth: none · Authorization: Holder of the MFA challenge.


        Idempotency: n/a · Rate-limit class: `RL-OTP-VERIFY` · Audit: auth.login.succeeded / auth.login.failed (security)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMfaVerifyRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-10
      x-fundzim-auth: none
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-VERIFY
      x-fundzim-audit: auth.login.succeeded / auth.login.failed (security)
      x-fundzim-error-codes:
      - CSRF_TOKEN_INVALID
      - INVALID_CREDENTIALS
      - OTP_ATTEMPTS_EXCEEDED
      - VALIDATION_FAILED
  /admin/auth/step-up:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: staffStartStepUp
      summary: Staff step-up challenge (WebAuthn/TOTP)
      description: '**AUTH-11** · Auth: staff + MFA · Authorization: Any staff.


        Idempotency: n/a · Rate-limit class: `RL-STAFF-WRITE` · Audit: —'
      security:
      - staffSession: []
        csrfToken: []
      responses:
        '201':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMfaChallengeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-11
      x-fundzim-auth: staff+MFA
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-STAFF-WRITE
      x-fundzim-audit: —
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
      - MFA_REQUIRED
      - PERMISSION_DENIED
  /admin/auth/step-up/verify:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags:
      - Authentication
      operationId: staffVerifyStepUp
      summary: Complete staff step-up
      description: '**AUTH-12** · Auth: staff + MFA · Authorization: Any staff.


        Idempotency: n/a · Rate-limit class: `RL-OTP-VERIFY` · Audit: auth.step_up.succeeded (security)'
      security:
      - staffSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMfaVerifyRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-12
      x-fundzim-auth: staff+MFA
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-OTP-VERIFY
      x-fundzim-audit: auth.step_up.succeeded (security)
      x-fundzim-error-codes:
      - AUTHENTICATION_REQUIRED
      - CSRF_TOKEN_INVALID
      - INVALID_CREDENTIALS
      - MFA_REQUIRED
      - OTP_ATTEMPTS_EXCEEDED
      - PERMISSION_DENIED
      - VALIDATION_FAILED
  /admin/me:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    get:
      tags:
      - Authentication
      operationId: getStaffSelf
      summary: Signed-in staff member, roles, permissions
      description: '**AUTH-13** · Auth: staff + MFA · Authorization: Any staff.


        Idempotency: n/a · Rate-limit class: `RL-STAFF-READ` · Audit: —'
      security:
      - staffSession: []
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSelfEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-fundzim-endpoint-id: AUTH-13
      x-fundzim-auth: staff+MFA
      x-fundzim-idempotency: n/a
      x-fundzim-rate-limit-class: RL-STAFF-READ
