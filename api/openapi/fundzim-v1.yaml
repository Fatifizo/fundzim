          maxLength: 500
      required:
      - amount
      - destination_id
      additionalProperties: false
    PayoutRequest:
      type: object
      description: Owner view of a payout request. No eligibility check detail, no hold reasons, no approver identities.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        campaign_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PayoutStatus'
        display_status:
          type: string
          enum:
          - REQUESTED
          - UNDER_REVIEW
          - APPROVED
          - PROCESSING
          - CONFIRMING
          - PAID
          - FAILED
          - REJECTED
          - CANCELLED
          - RETURNED
          description: Owner wording per payout-lifecycle.md §2.1; UNKNOWN → CONFIRMING.
        destination:
          $ref: '#/components/schemas/PayoutDestinationSnapshot'
        owner_cancellable:
          type: boolean
          description: True only in PAYOUT_REQUESTED, PENDING_REVIEW, APPROVED.
