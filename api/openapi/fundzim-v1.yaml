      value:
        error:
          code: APPROVER_CONFLICT
          message: You can't approve this payout.
          retryable: false
          details:
          - code: CONFLICT_MAKER_IS_CHECKER
        meta:
          request_id: 01JAB7Q9X4M2T8K5V3N6P0R1SZ
  schemas:
    Uuid:
      type: string
      format: uuid
      description: 'UUIDv7 identifier. Not a secret: authorisation never depends on it being unguessable.'
      examples:
      - 01927f3e-8b6a-7c41-9d2e-5f0a1b2c3d4e
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC timestamp with `Z`.
      examples:
      - '2026-10-08T07:30:00Z'
    PublicCode:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{10}$
      description: 'Campaign public code: 10 characters, Crockford base32, random (baseline §7). Used in `/c/{slug}-{public_code}`.'
      examples:
      - 7K3M9QX2TB
    ReceiptNumber:
      type: string
      pattern: ^[A-Z0-9-]{8,24}$
      description: 'Donor-facing receipt number: random, unique, not enumerable (baseline §7). Format fixed in Stage 10.'
      examples:
      - FZ-R-4K7Q-9MXT-2B
    PhoneE164:
      type: string
      pattern: ^\+[1-9][0-9]{7,14}$
      description: E.164 phone number. Accepted only in request bodies of the owner of the number; responses return `MaskedContact`.
    Currency:
      type: string
      description: ISO 4217 code from the currency registry. ZiG is `ZWG` (display "ZiG"). New codes are additive but treated as potentially breaking
        (ADR-026).
      enum:
      - USD
      - ZWG
    AmountMinor:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Non-negative integer count of minor units as a string (MONEY.md §3.3). Never a JSON number. Must fit int64.
      examples:
      - '10000'
    PositiveAmountMinor:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Strictly positive minor units as a string.
      examples:
      - '2500'
    SignedAmountMinor:
      type: string
      pattern: ^(0|-?[1-9][0-9]{0,18})$
      description: Signed minor units as a string (ledger/statement deltas only).
      examples:
      - '-1500'
    Money:
      type: object
      description: 'Money: amount in minor units plus currency. Amounts of different currencies are never summed or compared (MONEY.md).'
      properties:
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        formatted:
          type: string
          description: Display-only, server-formatted (e.g. "US$100.00"). Clients never parse it.
      required:
      - amount_minor
      - currency
      examples:
      - amount_minor: '10000'
        currency: USD
        formatted: US$100.00
    PositiveMoney:
      type: object
      description: Money with a strictly positive amount (request bodies).
      properties:
        amount_minor:
          $ref: '#/components/schemas/PositiveAmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - amount_minor
      - currency
      additionalProperties: false
    SignedMoney:
      type: object
      description: Signed money (statement and ledger lines only).
      properties:
        amount_minor:
          $ref: '#/components/schemas/SignedAmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - amount_minor
      - currency
    MaskedContact:
      type: object
      description: Masked contact value. Full values are returned only to their owner on `/me`.
      properties:
        kind:
          type: string
          enum:
          - PHONE
          - EMAIL
        masked:
          type: string
          description: e.g. `+263 77* *** *45` or `t***@example.com`
        verified:
          type: boolean
      required:
      - kind
      - masked
      - verified
    ResponseMeta:
      type: object
      description: Envelope metadata.
      properties:
        request_id:
          type: string
          description: Echo of `X-Request-ID`.
      required:
      - request_id
    PageMeta:
      type: object
      description: Envelope metadata for cursor-paginated lists.
      properties:
        request_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor; null when there are no more items. Bound to the filters and sort of the original request.
      required:
      - request_id
      - limit
      - next_cursor
    ErrorDetail:
      type: object
      description: Field-level or categorised detail. Safe to show; never contains internals.
      properties:
        field:
          type: string
          description: Dotted path of the offending input field (e.g. `amount.amount_minor`). Absent for non-field details.
        code:
          type: string
          description: Detail code (error-model.md §5, or a payout reason category, or an APPROVER_CONFLICT category).
        message:
          type: string
        meta:
          type: object
          description: Non-sensitive structured hints, e.g. `required_level`, `minimum` (Money), `max_age_seconds`, `payment_id` of the caller's
            own unresolved payment.
      required:
      - code
    Error:
      type: object
      description: Error body.
      properties:
        code:
          type: string
          description: Stable UPPER_SNAKE code. Clients branch on this. Unknown codes must be handled by HTTP status.
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          description: Human-readable, safe to display, never contains SQL, stack traces, other users' identifiers, or hold/STR/screening reasons.
        retryable:
          type: boolean
          description: True only if repeating the identical request later may succeed (honour Retry-After).
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
      - retryable
    ErrorResponse:
      type: object
      description: Standard error envelope.
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - error
      - meta
    AuditMetadata:
      type: object
      description: Staff-visible change metadata (staff DTOs only).
      properties:
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          oneOf:
          - $ref: '#/components/schemas/ActorRef'
          - type: 'null'
          description: Null for system-created rows.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        updated_by:
          oneOf:
          - $ref: '#/components/schemas/ActorRef'
          - type: 'null'
        version:
          type: integer
          description: Optimistic-concurrency version (send back in `version` on updates).
        request_id:
          type:
          - string
          - 'null'
          description: '`X-Request-ID` of the request that last changed the resource.'
      required:
      - created_at
      - created_by
      - updated_at
      - updated_by
      - version
      - request_id
    ActorRef:
      type: object
      description: Reference to an actor in staff views. Never includes contact data.
      properties:
        actor_type:
          type: string
          enum:
          - USER
          - STAFF
          - SYSTEM
          - PROVIDER
        actor_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        display_name:
          type:
          - string
          - 'null'
        role:
          type: string
      required:
      - actor_type
      - actor_id
      - display_name
    StaffActionRequest:
      type: object
      description: Common body for staff decisions/actions. `justification` is mandatory free text (AUDIT J actions).
      properties:
        reason_code:
          type: string
          description: From the controlled list for the action.
          maxLength: 64
        justification:
          type: string
          minLength: 10
          maxLength: 2000
        evidence_record_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        case_id:
          $ref: '#/components/schemas/Uuid'
      required:
      - reason_code
      - justification
      additionalProperties: false
    Accepted:
      type: object
      description: Generic 202 body for asynchronous work.
      properties:
        job_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
          - QUEUED
      required:
      - job_id
      - status
    PaymentStatus:
      type: string
      description: Payment intent status (baseline §8, ADR-020). `PROCESSING` is not a payment state.
      enum:
      - CREATED
      - PENDING
      - REQUIRES_ACTION
      - AUTHORISED
      - UNKNOWN
      - SUCCEEDED
      - FAILED
      - EXPIRED
      - CANCELLED
      - PARTIALLY_REFUNDED
      - REFUNDED
      - DISPUTED
      - CHARGED_BACK
    PayoutStatus:
      type: string
      description: Payout request status (baseline §8, ADR-020).
      enum:
      - PAYOUT_REQUESTED
      - PENDING_REVIEW
      - APPROVED
      - SUBMITTED
      - PROCESSING
      - UNKNOWN
      - COMPLETED
      - FAILED
      - REJECTED
      - CANCELLED
      - REVERSED
    RefundRequestStatus:
      type: string
      description: Refund request status (baseline §8).
      enum:
      - REQUESTED
      - PENDING_APPROVAL
      - ON_HOLD
      - APPROVED
      - EXECUTING
      - COMPLETED
      - FAILED
      - REJECTED
      - WITHDRAWN
    RefundTransactionStatus:
      type: string
      description: Refund transaction status (baseline §8).
      enum:
      - CREATED
      - PENDING
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    DisputeStatus:
      type: string
      description: Dispute status (baseline §8).
      enum:
      - OPENED
      - EVIDENCE_REQUIRED
      - EVIDENCE_SUBMITTED
      - UNDER_PROVIDER_REVIEW
      - WON
      - LOST
      - ACCEPTED
      - EXPIRED
    CampaignStatus:
      type: string
      description: Campaign lifecycle status (baseline §8, PRODUCT §6).
      enum:
      - DRAFT
      - SUBMITTED
      - UNDER_REVIEW
      - APPROVED
      - ACTIVE
      - COMPLETED
      - REJECTED
      - SUSPENDED
      - FROZEN
      - CANCELLED
    CampaignVisibility:
      type: string
      description: Publication visibility, separate from status (baseline §8).
      enum:
      - PUBLIC
      - UNLISTED
      - HIDDEN
    KycLevel:
      type: string
      description: Individual verification level (ADR-015).
      enum:
      - UNVERIFIED
      - BASIC_VERIFIED
      - IDENTITY_VERIFIED
      - PAYOUT_VERIFIED
    VerificationStatus:
      type: string
      description: Verification status overlay (ADR-015), shared by KYC and KYB.
      enum:
      - ACTIVE
      - PENDING_REVIEW
      - REJECTED
      - SUSPENDED
    KybLevel:
      type: string
      description: Organisation verification level.
      enum:
      - ORG_UNVERIFIED
      - ORG_REGISTERED_VERIFIED
      - ORG_KYB_VERIFIED
      - ORG_PAYOUT_VERIFIED
    ComplianceCaseState:
      type: string
      description: Compliance case state (baseline §8).
      enum:
      - OPEN
      - IN_PROGRESS
      - AWAITING_INFO
      - PENDING_APPROVAL
      - DECIDED
      - CLOSED
      - REOPENED
    BeneficiaryType:
      type: string
      description: Beneficiary type (beneficiary-verification.md §2).
      enum:
      - SELF
      - INDIVIDUAL_OTHER
      - MINOR
      - INCAPACITATED_ADULT
      - DECEASED_ESTATE_OR_FAMILY
      - INSTITUTION
      - ORGANISATION
      - COMMUNITY_GROUP
    BeneficiaryVerificationStatus:
      type: string
      description: Beneficiary verification status.
      enum:
      - NOT_STARTED
      - DECLARED
      - EVIDENCE_SUBMITTED
      - VERIFIED
      - REJECTED
    PayeeType:
      type: string
      description: Who a payout destination belongs to (beneficiary-verification.md §5).
      enum:
      - OWNER
      - BENEFICIARY
      - INSTITUTION
      - ORGANISATION
    PaymentMethodType:
      type: string
      description: Payment method family. The concrete `network` (e.g. ECOCASH) comes from the capability registry, not from this enum.
      enum:
      - MOBILE_MONEY
      - CARD
      - BANK_TRANSFER
    PayoutRail:
      type: string
      description: Payout rail family; `network` comes from the capability registry.
      enum:
      - MOBILE_MONEY
      - BANK_ACCOUNT
    DonationVisibility:
      type: string
      description: Donor visibility choice (PRODUCT §8.1). Anonymity is towards the public and the owner, never towards FundZim.
      enum:
      - PUBLIC
      - AMOUNT_HIDDEN
      - ANONYMOUS
    OrgRole:
      type: string
      description: Organisation role. ORG_FINANCE is not defined by Stage 0/1 (see authorization-matrix.md §8).
      enum:
      - ORG_ADMIN
      - ORG_MEMBER
    HoldType:
      type: string
      description: Hold types (payout-eligibility-and-controls.md §5; owned by `risk`).
      enum:
      - CAMPAIGN_FREEZE
      - COMPLIANCE_HOLD
      - PAYOUT_HOLD
      - DISPUTE_HOLD
      - DESTINATION_HOLD
      - RECOVERY_HOLD
      - ACCOUNT_HOLD
      - PROVIDER_HOLD
    FundraisingAuthorityType:
      type: string
      description: Fundraising authority basis (PRODUCT §6.3, kyb-architecture.md §4). LEGAL_REVIEW_REQUIRED (LR-046–LR-050).
      enum:
      - SELF_FUNDRAISING
      - REGISTERED_PVO
      - EXCLUDED_BODY
      - S8_TEMPORARY_AUTHORITY
    RefundReasonCode:
      type: string
      description: Refund reason codes (refund-and-dispute-architecture.md §2.1).
      enum:
      - DONOR_REQUEST
      - DUPLICATE_PAYMENT
      - PAYMENT_ERROR
      - CAMPAIGN_CANCELLED
      - CAMPAIGN_FRAUD
      - COMPLIANCE_ORDER
      - OTHER
    PayoutNotEligibleCategory:
      type: string
      description: Owner-safe reason categories for PAYOUT_NOT_ELIGIBLE and eligibility previews (error-model.md §6). `PAYOUTS_PAUSED` is never
        refined.
      enum:
      - CAMPAIGN_NOT_ELIGIBLE
      - REQUESTER_NOT_AUTHORISED
      - VERIFICATION_REQUIRED
      - BENEFICIARY_NOT_VERIFIED
      - DESTINATION_NOT_VERIFIED
      - DESTINATION_COOLING_OFF
      - CURRENCY_OR_RAIL_UNSUPPORTED
      - INSUFFICIENT_AVAILABLE_FUNDS
      - AMOUNT_OUT_OF_RANGE
      - FUNDRAISING_AUTHORITY_INVALID
      - PAYOUTS_PAUSED
      - TEMPORARILY_UNAVAILABLE
    OtpSendRequest:
      type: object
      description: Request a one-time code. Response is identical whether or not the identifier is registered.
      properties:
        channel:
          type: string
          enum:
          - SMS
          - EMAIL
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
          maxLength: 254
        purpose:
          type: string
          enum:
          - LOGIN
          description: Only LOGIN here; other purposes use their own flows (step-up, contact change).
        challenge_response:
          type: string
          description: Anti-abuse challenge token when CHALLENGE_REQUIRED was returned.
      required:
      - channel
      - purpose
      additionalProperties: false
    OtpChallenge:
      type: object
      description: Opaque OTP challenge handle. Never echoes the destination in full.
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        resend_available_at:
          $ref: '#/components/schemas/Timestamp'
        destination_hint:
          type: string
          description: Masked destination.
      required:
      - challenge_id
      - expires_at
      - resend_available_at
    OtpVerifyRequest:
      type: object
      description: Verify a login OTP. Success sets `__Host-fz_session` (rotated).
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{6,8}$
      required:
      - challenge_id
      - code
      additionalProperties: false
    SessionInfo:
      type: object
      description: Current session. Also the way the web app obtains the CSRF token.
      properties:
        session_kind:
          type: string
          enum:
          - USER
          - STAFF
          description: There are no guest sessions (baseline §12 I-2).
        user_id:
          $ref: '#/components/schemas/Uuid'
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on unsafe methods.
        idle_expires_at:
          $ref: '#/components/schemas/Timestamp'
        absolute_expires_at:
          $ref: '#/components/schemas/Timestamp'
        step_up_valid_until:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        mfa_verified:
          type: boolean
          description: Staff only; always false for users.
      required:
      - session_kind
      - user_id
      - csrf_token
      - idle_expires_at
      - absolute_expires_at
      - step_up_valid_until
      - mfa_verified
    StepUpChallengeRequest:
      type: object
      description: Start a step-up challenge for the current user session.
      properties:
        purpose:
          type: string
          enum:
          - STEP_UP
          - PAYOUT_DESTINATION_CHANGE
          - PAYOUT_REQUEST
          - CONTACT_CHANGE
          - DATA_EXPORT
          - CAMPAIGN_CLOSE_WITH_FUNDS
        channel:
          type: string
          enum:
          - SMS
          - EMAIL
      required:
      - purpose
      additionalProperties: false
    StepUpVerifyRequest:
      type: object
      description: 'Complete step-up: OTP for users; WebAuthn assertion or TOTP for staff.'
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{6,8}$
        webauthn_assertion:
          type: object
          description: WebAuthn `PublicKeyCredential` JSON (staff).
      required:
      - challenge_id
      additionalProperties: false
    StaffLoginRequest:
      type: object
      description: 'Staff login step 1: email + password (Argon2id). Always followed by mandatory WebAuthn or TOTP (baseline §12 I-6); no email/SMS
        OTP for staff.'
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 256
      required:
      - email
      - password
      additionalProperties: false
    StaffMfaChallenge:
      type: object
      description: MFA challenge for a staff login or staff step-up.
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        methods:
          type: array
          items:
            type: string
            enum:
            - WEBAUTHN
            - TOTP
        webauthn_request_options:
          type: object
          description: PublicKeyCredentialRequestOptions JSON.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - challenge_id
      - methods
      - expires_at
    StaffMfaVerifyRequest:
      type: object
      description: Complete staff MFA. SMS is never accepted.
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        webauthn_assertion:
          type: object
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - challenge_id
      additionalProperties: false
    MfaMethod:
      type: object
      description: Enrolled staff MFA method (no secrets).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - WEBAUTHN
          - TOTP
        label:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - kind
      - label
      - created_at
      - last_used_at
    MfaEnrolmentRequest:
      type: object
      description: Begin/complete staff MFA enrolment (two-step; `attestation` completes WebAuthn, `totp_code` confirms TOTP).
      properties:
        kind:
          type: string
          enum:
          - WEBAUTHN
          - TOTP
        label:
          type: string
          maxLength: 64
        attestation:
          type: object
        totp_code:
          type: string
        enrolment_id:
          $ref: '#/components/schemas/Uuid'
      required:
      - kind
      - label
      additionalProperties: false
    SessionSummary:
      type: object
      description: One of the caller's sessions (no token, no hash).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        current:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        device_label:
          type:
          - string
          - 'null'
        ip_country:
          type:
          - string
          - 'null'
      required:
      - id
      - current
      - created_at
      - last_seen_at
      - device_label
      - ip_country
    User:
      type: object
      description: Self view of the signed-in user (`/me`). Only place full contact values are returned.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        preferred_locale:
          type: string
        phone:
          oneOf:
          - $ref: '#/components/schemas/PhoneE164'
          - type: 'null'
        phone_verified:
          type: boolean
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        email_verified:
          type: boolean
        verification:
          $ref: '#/components/schemas/KYCStatus'
        organisations:
          type: array
          items:
            $ref: '#/components/schemas/OrganisationMembershipSummary'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - display_name
      - phone
      - phone_verified
      - email
      - email_verified
      - verification
      - organisations
      - created_at
    PublicUser:
      type: object
      description: Minimal public view of a person (campaign organiser). No contact data, no verification detail beyond a badge.
      properties:
        display_name:
          type: string
        identity_verified:
          type: boolean
          description: 'Badge only: owner holds IDENTITY_VERIFIED or higher with ACTIVE status.'
      required:
      - display_name
      - identity_verified
    UserProfileUpdate:
      type: object
      description: Editable profile fields.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        preferred_locale:
          type: string
          enum:
          - en
          - sn
          - nd
        version:
          type: integer
      required:
      - version
      additionalProperties: false
    ContactChangeRequest:
      type: object
      description: Start changing phone or email. Requires step-up; triggers payout hold + cooling-off and notification to old and new contacts.
      properties:
        kind:
          type: string
          enum:
          - PHONE
          - EMAIL
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - kind
      additionalProperties: false
    ContactChange:
      type: object
      description: Pending contact change.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - PHONE
          - EMAIL
        status:
          type: string
          enum:
          - PENDING_VERIFICATION
          - COMPLETED
          - EXPIRED
        new_value_masked:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kind
      - status
      - new_value_masked
      - expires_at
    ContactChangeVerifyRequest:
      type: object
      description: OTP sent to the new contact.
      properties:
        code:
          type: string
          pattern: ^[0-9]{6,8}$
      required:
      - code
      additionalProperties: false
    ActivityItem:
      type: object
      description: 'User-facing activity history item (AUDIT §7): logins, security changes, payouts.'
      properties:
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        kind:
          type: string
        summary:
          type: string
        ip_country:
          type: string
      required:
      - occurred_at
      - kind
      - summary
    DataRightsRequest:
      type: object
