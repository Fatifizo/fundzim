          $ref: '#/components/schemas/PayoutNotEligibleCategory'
        provider_fee:
          $ref: '#/components/schemas/Money'
        beneficiary_received:
          $ref: '#/components/schemas/Money'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
