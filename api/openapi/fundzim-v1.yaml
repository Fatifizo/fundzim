      properties:
        destination_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          description: Campaign version.
      required:
      - destination_id
      - version
      additionalProperties: false
    PayoutRequestCreate:
      type: object
      description: Owner payout request. Amount must be ≤ available in that currency; the destination is the campaign's verified destination (snapshotted).
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoney'
