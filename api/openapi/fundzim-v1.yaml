          $ref: '#/components/schemas/PhoneE164'
      additionalProperties: false
    DonationCreateRequest:
      type: object
      description: Create a donation and its payment intent. The provider is called only after the intent is committed.
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodSelection'
        donor:
          $ref: '#/components/schemas/DonorDetails'
        visibility:
          $ref: '#/components/schemas/DonationVisibility'
        message:
          type: string
          maxLength: 500
        share_contact_with_owner:
          type: boolean
          description: Explicit consent to share contact with the campaign owner (default false).
        ref_code:
          type: string
          pattern: ^[A-Za-z0-9]{6,16}$
        return_path:
          type: string
          description: Same-origin path for hosted-page return.
          pattern: ^/[A-Za-z0-9/_\-]{0,200}$
        acknowledged_unresolved_payment_id:
          allOf:
          - $ref: '#/components/schemas/Uuid'
          description: 'Deliberate override of the I-7 guard: accepted only after the configured delay (`override_available_after` in the 409
            details).'
        terms_version:
          type: string
      required:
      - amount
      - payment_method
      - visibility
      - terms_version
      additionalProperties: false
    NextAction:
